<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYSTEM BREACH">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>SYSTEM BREACH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --c: #FFAEC9; }

  html {
    height: 100%;
  }

  body {
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(186,104,255,0.14), transparent 60%),
      radial-gradient(1000px 600px at 85% 90%, rgba(255,174,201,0.12), transparent 60%),
      radial-gradient(800px 500px at 70% 20%, rgba(0,150,255,0.08), transparent 55%),
      #050000;
    width: 100vw;
    width: 100dvw;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Pacifico', cursive;
    color: var(--c);
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* Lớp bokeh ánh sáng mờ nổi phía trên nền, sau matrix */
  .aurora {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .aurora .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: drift 18s ease-in-out infinite;
  }
  .blob.b1 { width: 40vmax; height: 40vmax; left: -10%; top: -10%;
    background: radial-gradient(circle, rgba(186,104,255,0.5), transparent 70%);
    animation-duration: 22s; }
  .blob.b2 { width: 35vmax; height: 35vmax; right: -10%; bottom: -10%;
    background: radial-gradient(circle, rgba(255,174,201,0.45), transparent 70%);
    animation-duration: 26s; animation-delay: 3s; }
  .blob.b3 { width: 25vmax; height: 25vmax; left: 40%; top: 35%;
    background: radial-gradient(circle, rgba(0,150,255,0.30), transparent 70%);
    animation-duration: 30s; animation-delay: 6s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(8vmax, -5vmax) scale(1.1); }
    66% { transform: translate(-6vmax, 4vmax) scale(0.95); }
  }

  /* Spacer 1px -> kích hoạt scroll để toolbar tự ẩn trên Android */
  .toolbar-spacer {
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  #mainContent {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #matrix {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.12;
    pointer-events: none;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    background: repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 1px,transparent 1px,transparent 3px);
    pointer-events: none;
  }

  .glitch-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    animation: glitch 0.3s infinite;
    opacity: 0.03;
    background: var(--c);
  }
  @keyframes glitch {
    0%   { clip-path: inset(40% 0 61% 0); transform: translate(-2px, 0); }
    20%  { clip-path: inset(92% 0 1% 0);  transform: translate(2px, 0); }
    40%  { clip-path: inset(43% 0 1% 0);  transform: translate(-1px, 0); }
    60%  { clip-path: inset(25% 0 58% 0); transform: translate(1px, 0); }
    80%  { clip-path: inset(54% 0 7% 0);  transform: translate(-2px, 0); }
    100% { clip-path: inset(58% 0 43% 0); transform: translate(0); }
  }

  .message {
    position: relative;
    z-index: 10;
    font-size: clamp(18px, 3.4vw, 40px);
    line-height: 1.7;
    text-align: center;
    max-width: 92vw;
    letter-spacing: 1px;
    color: var(--c);
    text-shadow:
      0 0 10px var(--c),
      0 0 20px var(--c),
      0 0 40px rgba(255,255,255,0.20);
    animation: glowPulse 2.5s ease-in-out infinite;
  }

  /* GLOW PULSE mềm mại - không sến */
  @keyframes glowPulse {
    0%, 100% {
      text-shadow:
        0 0 10px var(--c),
        0 0 20px var(--c),
        0 0 40px rgba(255,255,255,0.18);
    }
    50% {
      text-shadow:
        0 0 12px #fff,
        0 0 25px var(--c),
        0 0 60px rgba(255,255,255,0.45);
    }
  }

  /* HẠT ÁNH SÁNG LẤP LÁNH nổi phía trên, rất nhẹ */
  .sparkles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
    animation: sparkleTwinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes sparkleTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.3); }
    50% { opacity: 0.7; transform: scale(1); }
  }

  .message .cursor {
    display: inline-block;
    width: 0.4em;
    height: 1em;
    background: var(--c);
    animation: blink 0.7s step-end infinite;
    vertical-align: text-bottom;
    box-shadow: 0 0 8px var(--c);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sub-message {
    display: none;
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div id="mainContent">
  <canvas id="matrix"></canvas>
  <div class="scanlines"></div>
  <div class="glitch-overlay"></div>
  <div class="message" id="message"></div>
  <div class="sparkles" id="sparkles"></div>
  <div class="sub-message"></div>
</div>

<div class="toolbar-spacer"></div>

<script>
// GIẤU THANH ĐỊA CHỈ (URL BAR)
function collapseToolbar() {
  const vh = window.innerHeight;
  document.body.style.minHeight = (vh + 2) + 'px';
  window.scrollTo(0, 2);
  setTimeout(function() {
    document.body.style.minHeight = '100dvh';
    if (window.innerHeight > vh) {
      window.scrollTo(0, 0);
    }
  }, 500);
}

function fitScreen() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  document.getElementById('matrix').width = w;
  document.getElementById('matrix').height = h;
}

// REGISTER PWA (cho "Add to Home Screen" => fullscreen thật)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}

// MATRIX RAIN - chữ "Q" màu hồng
let matrixInterval;
function initMatrix() {
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FFAEC9';
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      ctx.fillText('Q', i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  if (matrixInterval) clearInterval(matrixInterval);
  matrixInterval = setInterval(draw, 50);

  window.addEventListener('resize', function() {
    fitScreen();
    collapseToolbar();
  });
}

// TYPEWRITER MESSAGE
const fullMessage = 'Anh mua một bó hoa tươi, chỉ để thấy một bông hoa cười.\nHy vọng được thêm nhiều lần làm bông hoa cười...🌹';
const messageEl = document.getElementById('message');

// TẠO HẠT LẤP LÁNH NGẪU NHIÊN
function createSparkles() {
  const container = document.getElementById('sparkles');
  container.innerHTML = '';
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.setProperty('--dur', (3 + Math.random() * 3) + 's');
    s.style.setProperty('--delay', (Math.random() * 4) + 's');
    container.appendChild(s);
  }
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
}

function typeMessage() {
  const parts = fullMessage.split('\n');
  let partIndex = 0;

  // Hàm làm mờ dần và chuyển sang dòng kế (hoặc lặp lại nếu hết)
  function fadeToNext() {
    messageEl.style.transition = 'opacity 0.7s';
    messageEl.style.opacity = '0';
    setTimeout(function() {
      messageEl.style.transition = '';
      messageEl.style.opacity = '';
      partIndex = (partIndex + 1) % parts.length;
      typePart();
    }, 600);
  }

  function typePart() {
    const text = parts[partIndex];
    let idx = 0;
    messageEl.innerHTML = '';

    const typeInterval = setInterval(() => {
      idx++;
      messageEl.innerHTML = escHtml(text.slice(0, idx)) + '<span class="cursor"></span>';
      if (idx >= text.length) {
        clearInterval(typeInterval);
        setTimeout(fadeToNext, 1600);
      }
    }, 160);
  }

  typePart();
}

// RANDOM SCREEN FLICKER
setInterval(() => {
  if (Math.random() > 0.95) {
    document.body.style.filter = 'brightness(2) hue-rotate(90deg)';
    setTimeout(() => { document.body.style.filter = 'none'; }, 50);
  }
}, 200);

// KHỞI TẠO
initMatrix();
createSparkles();
typeMessage();
setTimeout(function() { fitScreen(); collapseToolbar(); }, 200);
setTimeout(function() { fitScreen(); collapseToolbar(); }, 800);
</script>
</body>
</html>
